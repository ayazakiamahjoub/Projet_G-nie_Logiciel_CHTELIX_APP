<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CHITELIX - Simulateur</title>
</head>
<body>

    <h1>CHITELIX</h1>
    <h2>Saisir les déchets</h2>

    <label for="poids">Poids des déchets (en kg) :</label>
    <input type="number" id="poids" placeholder="Ex: 1000">

    <button onclick="calculer()">Estimer ma valorisation</button>

    <p id="resultat"></p>

    <script>
        function calculer() {
            // Récupérer le poids
            let poids = document.getElementById('poids').value;
            
            if(poids > 0) {
                // Formule réelle : 15% de chitosane
                let chitosane = poids * 0.15;
                // Formule CO2
                let co2 = chitosane * 2.5;
                
                document.getElementById('resultat').innerHTML = 
                    "Chitosane estimé : " + chitosane + " kg<br>" +
                    "CO2 évité : " + co2 + " kg";
            } else {
                document.getElementById('resultat').innerHTML = "Veuillez saisir un poids valide.";
            }
        }
    </script>

</body>
</html>
